services:
  mysql:
    image: mysql:8.4
    container_name: sistema-denuncia-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projeto_denuncia

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./banco.sql:/docker-entrypoint-initdb.d/banco.sql:ro

volumes:
  mysql_data: