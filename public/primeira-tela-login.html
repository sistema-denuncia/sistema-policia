<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#000000">
	<title>Escolha o acesso</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="access-layout">
		<section class="form-panel" aria-label="Escolha do tipo de acesso">
			<div class="form-wrap">
				<section class="form-view" aria-labelledby="access-title">
					<p class="form-kicker">ACESSO AO SISTEMA</p>
					<h2 id="access-title">Escolha seu acesso</h2>
					<p class="form-intro">Selecione o perfil para continuar.</p>

					<nav class="role-options" aria-label="Opções de login">
						<a class="register-button" href="login-adm.html">Login Administrador <span aria-hidden="true">→</span></a>
						<a class="register-button" href="login-agente.html">Login Agente <span aria-hidden="true">→</span></a>
					</nav>
				</section>
			</div>
			<footer class="form-footer"><span class="footer-lock" aria-hidden="true">●</span> Acesso protegido</footer>
		</section>
	</main>
</body>
</html>
