<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#06101b">
	<title>Login do agente</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="access-layout">
		<section class="form-panel" aria-label="Login do agente">
			<div class="form-wrap">
				<section class="form-view" aria-labelledby="agent-form-title">
					<p class="form-kicker">ACESSO DO AGENTE</p>
					<h2 id="agent-form-title">Boas-vindas</h2>
					<p class="form-intro">Entre com o usuário e a senha cadastrados pela administração.</p>

					<form id="form-agent-login">
						<label class="field-label" for="agent-login-usuario">Usuário</label>
						<input id="agent-login-usuario" name="usuario" type="text" autocomplete="username" placeholder="Digite seu usuário" minlength="3" maxlength="32" required>

						<label class="field-label" for="agent-login-senha">Senha</label>
						<div class="password-input-wrap">
							<input id="agent-login-senha" name="senha" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
							<button class="password-toggle" type="button" aria-label="Mostrar senha" aria-controls="agent-login-senha" aria-pressed="false" data-password-toggle>
								<svg class="password-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
									<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"></path>
									<circle cx="12" cy="12" r="3"></circle>
								</svg>
								<svg class="password-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
									<path d="m3 3 18 18"></path>
									<path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
									<path d="M9.9 5.2A11 11 0 0 1 12 5c6.4 0 10 7 10 7a15.7 15.7 0 0 1-3.1 3.8"></path>
									<path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10.8 10.8 0 0 0 4-.8"></path>
								</svg>
							</button>
						</div>

						<button class="submit-button" type="submit">Fazer login <span aria-hidden="true">→</span></button>
						<p class="form-message" id="agent-login-message" role="status" aria-live="polite"></p>
					</form>

				</section>
			</div>
			<footer class="form-footer"><span class="footer-lock" aria-hidden="true">●</span> Acesso protegido para agentes autorizados</footer>
		</section>
	</main>
	<script src="api.js"></script>
	<script src="script.js"></script>
</body>
</html>
