<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1320">
    <title>Central Operacional</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="painel.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3 4.8 6v5.6c0 4.8 3 7.9 7.2 9.4 4.2-1.5 7.2-4.6 7.2-9.4V6L12 3Z" stroke="currentColor" stroke-width="1.7"/><path d="m9 12 2 2 4-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <h1>Central Operacional</h1>
        </div>
        <div class="top-right">
            <button id="btnSom" class="chip" type="button" aria-pressed="true">Som ligado</button>
            <span class="chip conn" id="statusConexao"><i class="dot on"></i>Online</span>
            <span class="clock" id="relogio">--:--:--</span>
            <span class="operador" id="usuarioLogado" hidden>Operador: <strong id="nomeUsuario"></strong></span>
        </div>
    </header>

    <main class="wrap">
        <section class="kpis" aria-label="Resumo da operação">
            <div class="kpi crit"><span>Ativas</span><b id="metricAtivos">0</b><small id="metricCriticas">nenhuma crítica</small></div>
            <div class="kpi warn"><span>Em atendimento</span><b id="metricAtendimento">0</b><small>viaturas e operadores em campo</small></div>
            <div class="kpi wait"><span>Maior espera</span><b id="metricEspera">--:--:--</b><small>maior espera entre as ocorrências ativas</small></div>
            <div class="kpi ok"><span>Encerradas</span><b id="metricResolvidas">0</b><small id="metricFalsos">0 falsos alarmes</small></div>
            <div class="kpi"><span>Operadores online</span><b id="usuariosConectados">0</b><small id="ultimaAtualizacao">sem atualizações</small></div>
        </section>

        <nav class="filters" role="tablist" aria-label="Filtrar ocorrências">
            <button class="filtro active" data-filtro="ATIVO">Ativas <em id="badgeAtivos">0</em></button>
            <button class="filtro" data-filtro="EM_ATENDIMENTO">Em atendimento <em id="badgeAtendimento">0</em></button>
            <button class="filtro" data-filtro="ENCERRADAS">Encerradas <em id="badgeResolvidas">0</em></button>
            <button class="filtro" data-filtro="TODOS">Todas <em id="totalAlertas">0</em></button>
        </nav>

        <section id="alertasList" class="queue" aria-live="polite"></section>
    </main>

    <div id="toasts" class="toasts" role="region" aria-label="Novos acionamentos"></div>

    <div id="modalAlerta" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true">
        <div class="sheet"><div id="modalBody"></div></div>
    </div>

    <script src="client.js"></script>
</body>
</html>
