<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUPERVISOR</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #06101b;
      --panel: #0c1a2a;
      --panel-2: #0f2032;
      --line: rgba(148, 163, 184, .14);
      --line-strong: rgba(148, 163, 184, .24);
      --text: #e5eef7;
      --muted: #8194a7;
      --muted-2: #5e7184;
      --blue: #2f7cff;
      --cyan: #3bc7ff;
      --green: #39d98a;
    }

    body {
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0%, rgba(47,124,255,.10), transparent 30%),
        radial-gradient(circle at 88% 100%, rgba(59,199,255,.07), transparent 28%),
        var(--bg);
      font-family: Inter, "Segoe UI", sans-serif;
    }

    .cadastro-layout {
      display: grid;
      grid-template-columns: minmax(300px, 420px) minmax(460px, 1fr);
      gap: 18px;
      width: min(100%, 1060px);
      align-items: stretch;
    }

    .container {
      position: relative;
      width: 100%;
      padding: 38px 34px 34px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(12,26,42,.98), rgba(8,20,32,.98));
      box-shadow: 0 24px 70px rgba(0,0,0,.34);
    }

    .container::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--blue), var(--cyan));
    }

    h2 {
      margin-bottom: 8px;
      color: var(--text);
      font: 700 21px/1.25 "Segoe UI", sans-serif;
      letter-spacing: .02em;
      text-align: center;
    }

    h3 {
      margin-bottom: 26px;
      color: var(--muted);
      font: 10px "Consolas", monospace;
      letter-spacing: .10em;
      text-align: center;
      text-transform: uppercase;
    }

    .form-group { margin-bottom: 18px; }
    label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font: 600 10px "Consolas", monospace;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      outline: none;
      color: var(--text);
      background: rgba(6,16,27,.72);
      font: 13px "Segoe UI", sans-serif;
      transition: border-color .18s ease, box-shadow .18s ease;
    }

    input::placeholder { color: var(--muted-2); }
    input:focus {
      border-color: rgba(59,199,255,.72);
      box-shadow: 0 0 0 3px rgba(59,199,255,.10);
    }

    .form-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
    button, .btn-secondary {
      display: inline-block;
      width: 100%;
      padding: 12px 14px;
      border: 1px solid rgba(47,124,255,.55);
      border-radius: 8px;
      color: #fff;
      background: linear-gradient(135deg, #2569d9, #2f7cff);
      font: 700 11px "Consolas", monospace;
      letter-spacing: .12em;
      line-height: 1.2;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }

    button:hover, .btn-secondary:hover { filter: brightness(1.12); box-shadow: 0 8px 22px rgba(47,124,255,.22); transform: translateY(-1px); }
    button:focus-visible, .btn-secondary:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

    .mensagem-sucesso {
      display: none;
      margin-top: 16px;
      padding: 10px;
      border: 1px solid rgba(57,217,138,.20);
      border-radius: 8px;
      color: #96edbf;
      background: rgba(57,217,138,.08);
      font: 700 11px "Consolas", monospace;
      letter-spacing: .08em;
      text-align: center;
    }

    .agentes-panel {
      min-width: 0;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(12,26,42,.98), rgba(8,20,32,.98));
      box-shadow: 0 24px 70px rgba(0,0,0,.28);
    }

    .painel-kicker {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font: 600 10px "Consolas", monospace;
      letter-spacing: .14em;
    }

    .painel-header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
      margin-bottom: 20px;
    }

    .painel-header h2 {
      margin: 0;
      font-size: 18px;
      text-align: left;
    }

    .contador-agentes {
      color: var(--cyan);
      font: 600 12px "Consolas", monospace;
      white-space: nowrap;
    }

    .tabela-wrapper {
      max-height: 360px;
      overflow-x: auto;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 9px;
    }

    .tabela-agentes {
      width: 100%;
      border-collapse: collapse;
      min-width: 410px;
    }

    .tabela-agentes th,
    .tabela-agentes td {
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
    }

    .tabela-agentes th {
      color: var(--muted-2);
      background: rgba(6,16,27,.42);
      font: 600 9px "Consolas", monospace;
      letter-spacing: .10em;
      text-transform: uppercase;
    }

    .tabela-agentes td {
      color: #cbd9e6;
      font-size: 12px;
    }

    .tabela-agentes tbody tr:last-child td { border-bottom: none; }
    .status-agente {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #96edbf;
      font: 600 10px "Consolas", monospace;
    }

    .status-agente::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 3px rgba(57,217,138,.09);
    }

    .tabela-vazia td {
      padding: 46px 20px;
      color: var(--muted-2);
      text-align: center;
      font-size: 11px;
    }

    @media (max-width: 480px) {
      body { padding: 16px; }
      .container { padding: 32px 22px 26px; }
      h2 { font-size: 18px; }
    }

    @media (max-width: 820px) {
      .cadastro-layout { grid-template-columns: 1fr; max-width: 520px; }
      .agentes-panel { padding: 22px; }
    }
  </style>
</head>
<body>
 
  <div class="cadastro-layout">
    <div class="container">
      <h2>BEM-VINDO SUPERVISOR</h2>
      <h3> Cadastre o agente: </h3>
      <form id="formCadastroAgente" action="#" method="POST">
     
      <div class="form-group">
        <label for="login">Login do agente: </label>
        <input
          type="text"
          id="login"
          name="login"
          placeholder="Digite seu login"
          required
        >
      </div>
 
      <div class="form-group">
        <label for="senha">Senha do agente: </label>
        <input
          type="password"
          id="senha"
          name="senha"
          placeholder="Digite sua senha"
          required
        >
      </div>
 
      <div class="form-actions">
        <button type="submit">CADASTRAR</button>
      </div>

      <p id="mensagemSucesso" class="mensagem-sucesso" role="status">AGENTE CADASTRADO</p>
      </form>
    </div>

    <section class="agentes-panel" aria-labelledby="tituloAgentes">
      <div class="painel-header">
        <div>
          <span class="painel-kicker">GESTÃO DE ACESSOS</span>
          <h2 id="tituloAgentes">Agentes cadastrados</h2>
        </div>
        <span id="contadorAgentes" class="contador-agentes">0 agentes</span>
      </div>

      <div class="tabela-wrapper">
        <table class="tabela-agentes">
          <thead>
            <tr>
              <th>Login do agente</th>
              <th>Cadastro</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="listaAgentes">
            <tr class="tabela-vazia" id="tabelaVazia">
              <td colspan="3">Nenhum agente cadastrado</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    if (sessionStorage.getItem('supervisorAutenticado') !== 'true') {
      window.location.replace('adm-sistema.html');
    }

    const formCadastroAgente = document.getElementById('formCadastroAgente');
    const mensagemSucesso = document.getElementById('mensagemSucesso');
    const listaAgentes = document.getElementById('listaAgentes');
    const tabelaVazia = document.getElementById('tabelaVazia');
    const contadorAgentes = document.getElementById('contadorAgentes');
    const agentesSalvos = JSON.parse(localStorage.getItem('agentesCadastrados') || '[]');

    function atualizarTabela() {
      tabelaVazia.hidden = agentesSalvos.length > 0;
      contadorAgentes.textContent = `${agentesSalvos.length} agente${agentesSalvos.length === 1 ? '' : 's'}`;

      listaAgentes.querySelectorAll('tr:not(#tabelaVazia)').forEach(function(linha) {
        linha.remove();
      });

      agentesSalvos.forEach(function(agente) {
        const linha = document.createElement('tr');
        const login = document.createElement('td');
        const data = document.createElement('td');
        const status = document.createElement('td');
        const statusTexto = document.createElement('span');

        login.textContent = agente.login;
        data.textContent = agente.data;
        statusTexto.className = 'status-agente';
        statusTexto.textContent = 'ATIVO';
        status.appendChild(statusTexto);
        linha.append(login, data, status);
        listaAgentes.appendChild(linha);
      });
    }

    formCadastroAgente.addEventListener('submit', function(event) {
      event.preventDefault();
      agentesSalvos.push({
        login: document.getElementById('login').value.trim(),
        data: new Date().toLocaleDateString('pt-BR')
      });
      localStorage.setItem('agentesCadastrados', JSON.stringify(agentesSalvos));
      atualizarTabela();
      mensagemSucesso.style.display = 'block';
      formCadastroAgente.reset();
    });

    atualizarTabela();
  </script>

</body>
</html>
